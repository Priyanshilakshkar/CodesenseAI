
spring.application.name=demo
server.port=${PORT:8080}

# Database - TiDB Cloud
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/codesenseaidb?sslMode=VERIFY_IDENTITY
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Resilience4j Retry Config
resilience4j.retry.instances.githubApiRetry.max-attempts=3
resilience4j.retry.instances.githubApiRetry.wait-duration=1s
resilience4j.retry.instances.githubApiRetry.enable-exponential-backoff=true
resilience4j.retry.instances.githubApiRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.githubApiRetry.enable-randomized-wait=true
resilience4j.retry.instances.githubApiRetry.randomized-wait-factor=0.2

resilience4j.retry.instances.githubApiRetry.retry-exceptions[0]=java.io.IOException
resilience4j.retry.instances.githubApiRetry.retry-exceptions[1]=java.net.SocketTimeoutException
resilience4j.retry.instances.githubApiRetry.retry-exceptions[2]=java.net.ConnectException
resilience4j.retry.instances.githubApiRetry.retry-exceptions[3]=org.springframework.web.client.HttpServerErrorException

resilience4j.retry.instances.githubApiRetry.ignore-exceptions[0]=org.springframework.web.client.HttpClientErrorException$BadRequest
resilience4j.retry.instances.githubApiRetry.ignore-exceptions[1]=org.springframework.web.client.HttpClientErrorException$Unauthorized
resilience4j.retry.instances.githubApiRetry.ignore-exceptions[2]=org.springframework.web.client.HttpClientErrorException$Forbidden

# Groq API
codesense.openai.api-key=${GROQ_API_KEY}
codesense.openai.base-url=https://api.groq.com/openai/v1
codesense.openai.primary-model=openai/gpt-oss-120b
codesense.openai.fallback-model=openai/gpt-oss-20b
codesense.openai.max-tokens=1000
codesense.openai.max-prompt-tokens=6000
codesense.openai.confidence-threshold=70
codesense.openai.temperature=0.0
codesense.openai.timeout-seconds=60
codesense.openai.max-retries=3
codesense.openai.retry-delay-ms=1000
codesense.openai.max-tokens-per-pr=50000
codesense.openai.monthly-token-budget=0

# Security
codesense.security.jwtSecret=${JWT_SECRET}
codesense.security.encryptionKey=${AES_ENCRYPTION_KEY}

# GitHub App
codesense.github.rate-limit-threshold=100
codesense.github.private-key-path=private-key.pem
codesense.github.app-id=3813199
codesense.github.api-base-url=https://api.github.com
codesense.github.installation-id=134679421
codesense.github.webhook-secret=${GITHUB_WEBHOOK_SECRET}

# Spring
spring.main.allow-circular-references=true

# RabbitMQ - CloudAMQP
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true

# Redis - Upstash
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
